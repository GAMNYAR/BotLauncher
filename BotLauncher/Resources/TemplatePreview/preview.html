<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предпросмотр Telegram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-bubble: #182533;
            --bg-input: #242f3d;
            --text-primary: #ffffff;
            --text-secondary: #6c7883;
            --accent: #5aaeff;
            --border: #0e1621;
            --avatar-gradient: linear-gradient(135deg, #5aaeff, #3b82f6);
        }

        body.light-theme {
            --bg-primary: #e0e0e0;
            --bg-secondary: #ffffff;
            --bg-bubble: #ffffff;
            --bg-input: #f0f2f5;
            --text-primary: #000000;
            --text-secondary: #707579;
            --accent: #3390ec;
            --border: #d1d7db;
            --avatar-gradient: linear-gradient(135deg, #3390ec, #2b78c5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* LOADER */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

            .loader-container.hidden {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ICONS */
        .icon-svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            display: block;
        }

        .icon-svg-small {
            width: 16px;
            height: 16px;
            fill: currentColor;
            display: block;
        }

        .icon-svg-play {
            width: 28px;
            height: 28px;
            fill: white;
            display: block;
        }

        /* HEADER */
        .app-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

            .icon-btn:hover {
                background: rgba(128, 128, 128, 0.15);
                color: var(--text-primary);
            }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

            .chat-area::-webkit-scrollbar {
                width: 6px;
            }

            .chat-area::-webkit-scrollbar-thumb {
                background: var(--text-secondary);
                border-radius: 3px;
                opacity: 0.3;
            }

        .date-badge {
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            backdrop-filter: blur(4px);
        }

        body.light-theme .date-badge {
            background: rgba(0, 0, 0, 0.08);
            color: var(--text-secondary);
        }

        /* MESSAGE WRAPPER */
        .message-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 680px;
            width: 100%;
            transition: max-width 0.3s ease;
        }

            .message-wrapper.mobile {
                max-width: 360px;
            }

        /* AVATAR */
        .channel-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--avatar-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            text-transform: uppercase;
        }

            .channel-avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        /* BUBBLE */
        .message-bubble {
            background: var(--bg-bubble);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            flex: 1;
            position: relative;
        }

            /* ХВОСТИК СООБЩЕНИЯ (Telegram Style) */
            .message-bubble::before {
                content: "";
                position: absolute;
                bottom: 0;
                left: -8px;
                width: 0;
                height: 0;
                border-style: solid;
                border-width: 0 0 12px 12px;
                border-color: transparent transparent var(--bg-bubble) transparent;
                z-index: 1;
            }

        .bubble-header {
            padding: 10px 14px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-name {
            color: var(--accent);
            font-weight: 600;
            font-size: 14px;
        }

        .channel-type {
            color: var(--text-secondary);
            font-size: 13px;
            margin-left: 6px;
            font-weight: 400;
        }

        /* ATTACHMENTS GRID */
        .attachments {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            border-radius: 12px 12px 0 0;
        }

        .attachment-group {
            display: grid;
            gap: 2px;
            overflow: hidden;
        }

        .group-1 {
            grid-template-columns: 1fr;
        }

            .group-1 .att-item {
                aspect-ratio: 16/9;
            }

        .group-2 {
            grid-template-columns: 1fr 1fr;
        }

            .group-2 .att-item, .group-3 .att-item, .group-4 .att-item, .group-5 .att-item, .group-6 .att-item {
                aspect-ratio: 1/1;
            }

        .group-3 {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .group-4 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .group-5 {
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .group-6 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        .group-7, .group-8, .group-10, .group-11, .group-12 {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

            .group-7 .row, .group-8 .row, .group-10 .row, .group-11 .row, .group-12 .row {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 2px;
            }

                .group-7 .row .att-item, .group-8 .row .att-item, .group-10 .row .att-item, .group-11 .row .att-item, .group-12 .row .att-item {
                    aspect-ratio: 1/1;
                }

        .group-9 {
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

            .group-9 .att-item {
                aspect-ratio: 1/1;
            }

        .group-many {
            grid-template-columns: 1fr 1fr 1fr;
            grid-auto-rows: 1fr;
            max-height: 400px;
            overflow-y: auto;
        }

            .group-many .att-item {
                aspect-ratio: 1/1;
            }

        .att-item {
            position: relative;
            overflow: hidden;
            background: #1f232a;
        }

            .att-item img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.6);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .video-duration {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* TEXT & FOOTER */
        .message-text {
            padding: 4px 14px 12px;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .bubble-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 14px 10px;
            gap: 6px;
        }

        .views {
            color: var(--text-secondary);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .time {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .pinned-icon {
            color: var(--accent);
            display: none;
        }

            .pinned-icon.visible {
                display: flex;
                align-items: center;
            }

        /* INPUT AREA (Dummy) */
        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .input-field {
            flex: 1;
            background: var(--bg-input);
            border: none;
            border-radius: 20px;
            padding: 10px 18px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            font-family: inherit;
            cursor: default;
        }

            .input-field::placeholder {
                color: var(--text-secondary);
            }

        /* =========================================
           TELEGRAM FORMATTING STYLES
           ========================================= */
        b, strong {
            font-weight: 600;
        }

        i, em {
            font-style: italic;
        }

        del {
            text-decoration: line-through;
            opacity: 0.7;
        }

        u {
            text-decoration: underline;
        }

        .telegram-quote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            margin: 8px 0;
            color: var(--text-secondary);
            font-style: italic;
            display: block;
        }

        .telegram-link {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
        }

            .telegram-link:hover {
                text-decoration: underline;
            }

        .spoiler {
            background: var(--text-secondary);
            color: transparent;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
        }

            .spoiler:hover,
            .spoiler.revealed {
                background: rgba(139, 92, 246, 0.3);
                color: var(--text-primary);
            }

        code {
            font-family: 'Consolas', 'Monaco', monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #e0e7ff;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        pre {
            font-family: 'Consolas', 'Monaco', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            overflow-x: auto;
            font-size: 13px;
            color: #b4b4b4;
            border: 1px solid rgba(139, 92, 246, 0.2);
            line-height: 1.5;
        }

            pre code {
                background: transparent;
                padding: 0;
                border: none;
                color: inherit;
            }

        /* Светлая тема - корректировка кода */
        body.light-theme code {
            background: rgba(0, 0, 0, 0.08);
            color: #1e293b;
        }

        body.light-theme pre {
            background: rgba(0, 0, 0, 0.05);
            color: #334155;
        }
    </style>
</head>
<body>
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div class="loader-text">Загрузка предпросмотра...</div>
    </div>

    <div class="app-header">
        <div class="header-title">Предпросмотр</div>
        <div class="header-controls">
            <button class="icon-btn" id="themeBtn" title="Сменить тему"></button>
            <button class="icon-btn" id="viewBtn" title="Сменить вид"></button>
        </div>
    </div>

    <div class="chat-area">
        <div class="date-badge" id="dateBadge">Сегодня</div>

        <div class="message-wrapper" id="messageWrapper">
            <div class="channel-avatar" id="channelAvatar">Б</div>
            <div class="message-bubble">
                <div class="bubble-header">
                    <div>
                        <span class="channel-name" id="channelName">Бот</span>
                        <span class="channel-type" id="channelType">канал</span>
                    </div>
                </div>
                <div class="attachments" id="attachmentsContainer"></div>
                <div class="message-text" id="messageText"></div>
                <div class="bubble-footer">
                    <span class="pinned-icon" id="pinnedIcon">
                        <svg class="icon-svg-small" viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z" /></svg>
                    </span>
                    <span class="views">
                        <svg class="icon-svg-small" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" /></svg>
                        <span id="viewsCount">17</span>
                    </span>
                    <span class="time" id="messageTime">14:28</span>
                </div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="icon-btn" style="cursor: default;">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z" /></svg>
        </div>
        <input class="input-field" placeholder="Написать сообщение..." readonly>
        <div class="icon-btn" style="cursor: default;">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" /><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" /></svg>
        </div>
    </div>

    <script>
        const icons = {
            moon: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>',
            sun: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>',
            mobile: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>',
            desktop: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8v-1l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 12H3V4h18v10z"/></svg>'
        };

        let currentTheme = 'dark';
        let currentView = 'desktop';

        document.getElementById('themeBtn').addEventListener('click', function () {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.classList.toggle('light-theme', currentTheme === 'light');
            this.innerHTML = currentTheme === 'light' ? icons.sun : icons.moon;
            if (window.chrome?.webview) window.chrome.webview.postMessage('toggle_theme');
        });

        document.getElementById('viewBtn').addEventListener('click', function () {
            currentView = currentView === 'desktop' ? 'mobile' : 'desktop';
            document.getElementById('messageWrapper').classList.toggle('mobile', currentView === 'mobile');
            this.innerHTML = currentView === 'mobile' ? icons.mobile : icons.desktop;
            if (window.chrome?.webview) window.chrome.webview.postMessage('toggle_view');
        });

        window.updatePreview = function (data) {
            document.getElementById('loader').classList.add('hidden');

            document.getElementById('dateBadge').textContent = data.date;
            document.getElementById('channelName').textContent = data.channelName;
            document.getElementById('channelType').textContent = data.channelType;
            document.getElementById('attachmentsContainer').innerHTML = data.attachmentsHtml;
            document.getElementById('messageText').innerHTML = data.messageText;
            document.getElementById('viewsCount').textContent = data.views;
            document.getElementById('messageTime').textContent = data.time;

            // Обновляем аватарку (первая буква названия)
            document.getElementById('channelAvatar').textContent = data.channelName.charAt(0).toUpperCase();

            // Применяем тему и вид, если они пришли из C# (при первом запуске)
            if (data.isDark !== undefined) {
                currentTheme = data.isDark ? 'dark' : 'light';
                document.body.classList.toggle('light-theme', !data.isDark);
                document.getElementById('themeBtn').innerHTML = data.isDark ? icons.moon : icons.sun;
            }
            if (data.isMobile !== undefined) {
                currentView = data.isMobile ? 'mobile' : 'desktop';
                document.getElementById('messageWrapper').classList.toggle('mobile', data.isMobile);
                document.getElementById('viewBtn').innerHTML = data.isMobile ? icons.mobile : icons.desktop;
            }

            document.getElementById('pinnedIcon').classList.toggle('visible', Math.random() > 0.7);
        };

        // Обработка спойлеров (клик для раскрытия)
        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('spoiler')) {
                e.target.classList.toggle('revealed');
            }
        });

        window.addEventListener('load', function () {
            if (window.chrome?.webview) window.chrome.webview.postMessage('ready');
        });
    </script>
</body>
</html>
